<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento de Clientes</title>
</head>

<body>

  <h1>Seguimiento de Clientes</h1>

  <p>
    Registra los clientes interesados en tus productos
    para no perder oportunidades de venta.
  </p>

  <form>
    <label>Nombre del cliente</label><br>
    <input type="text" placeholder="Ej: Laura"><br><br>

    <label>WhatsApp</label><br>
    <input type="tel" placeholder="Ej: 3001234567"><br><br>

    <label>Producto</label><br>
    <input type="text" placeholder="Ej: Vestido negro"><br><br>

    <label>Talla</label><br>
    <select>
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
    </select><br><br>

    <button type="submit">
      Registrar cliente
    </button>
  </form>
  <h2>Clientes registrados</h2>
<div id="lista-clientes"></div>
<script src="script.js?v=2"></script>
</body>
</html>
